name: Skill tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: V3 regression (54 tests at release preparation)
        working-directory: skills/commercial-visual-production-v3-0-0
        run: python -m unittest discover -s tests -q
      - name: Isolated V2 compatibility (70 tests at release preparation)
        working-directory: skills/commercial-visual-production-v3-0-0/compat/v2
        run: python -m unittest discover -s tests -q
