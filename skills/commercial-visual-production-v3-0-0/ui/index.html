<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商业视觉 · V3.0.0</title><style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#152e38;background:#f1f5f4}body{max-width:1260px;margin:30px auto;padding:0 24px}h1{font-size:28px;margin:0}header{display:flex;justify-content:space-between;align-items:center}small,.muted{color:#526a73}button,select,input,textarea{font:inherit;border:1px solid #b8c9ca;border-radius:8px;padding:9px;background:white;color:#173740}button{cursor:pointer}button:hover{background:#dcebea}button.primary{background:#175e60;color:white}button:disabled{opacity:.5;cursor:default}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:24px 0}.step,section{background:white;border:1px solid #d8e2e1;border-radius:12px;padding:16px}.step b,.step small{display:block}.step small{margin-top:8px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}section{margin-bottom:18px}h2{font-size:18px;margin:0 0 14px}img{max-width:100%;max-height:470px;object-fit:contain;background:#e8eeee;border-radius:6px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row{border-top:1px solid #e6eceb;padding:11px 0;line-height:1.6;overflow-wrap:anywhere}.badge{font-size:12px;background:#e1f0e9;color:#28564a;border-radius:12px;padding:3px 8px;margin-left:8px}.alert{color:#8e381b;background:#fff1e9;padding:12px;border-radius:8px;margin:15px 0;white-space:pre-wrap}label{display:block;margin:9px 0}input,textarea{box-sizing:border-box;width:100%}textarea{min-height:70px}details{margin-top:12px}summary{cursor:pointer}#message:empty{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.steps{grid-template-columns:repeat(4,1fr)}}
select{max-width:100%;min-width:0}label select{display:block;width:100%}main,aside,section,.grid>*{min-width:0}.views{grid-template-columns:repeat(2,minmax(0,1fr))}.views>div{min-width:0}.toolbar select{max-width:100%;flex:1 1 160px}.step{overflow-wrap:anywhere}@media(max-width:600px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.views{grid-template-columns:1fr}body{padding:0 16px}header{gap:10px}header button{flex-shrink:0}}
</style><header><div><small>COMMERCIAL VISUAL WORKFLOW</small><h1>商业视觉工作台 <small>V3.0.0</small></h1></div><button id="refresh">刷新状态</button></header><p id="project" class="muted"></p><div id="message" class="alert" role="status"></div><div class="steps" id="stages"></div><div class="grid"><main><section><h2>当前画面与版本对比</h2><div class="toolbar"><select id="revision" aria-label="当前工作版本"></select><button id="select">选择此版继续</button><select id="compare" aria-label="对比版本"></select></div><div class="views"><div><small>当前选择</small><div id="view"></div></div><div><small>对比版本 / 蓝图</small><div id="comparison"></div></div></div><div class="toolbar"><button id="check" class="primary">运行检查</button><button id="accept">接受候选</button><button id="freeze">冻结母版</button><button id="export">导出并核验 PNG/ORA</button></div><div id="qc"></div></section><section><h2>继承要求与本轮变化</h2><div id="rules"></div><details><summary>查看被替换或舍弃的要求</summary><div id="oldrules"></div></details></section><section><h2>核验与问题闭环</h2><div id="checks"></div><label>检查项 <select id="check-id"></select></label><label>实际观察 <textarea id="observation" placeholder="描述实际看到的结果、依据和仍未知的内容"></textarea></label><div class="toolbar"><button id="pass">记录符合</button><button id="fail">记录不符合</button><button id="unknown">记录证据不足</button></div><details><summary>提交问题</summary><label>预期结果<input id="expected"></label><label>实际问题<input id="actual"></label><label>影响对象或区域<input id="scope"></label><label>等级<select id="severity"><option>P1</option><option>P0</option><option>P2</option></select></label><button id="issue">提交问题</button></details><div id="issues"></div></section></main><aside><section><h2>蓝图确认</h2><p id="blueprint"></p><button id="confirm">确认蓝图</button></section><section><h2>生产与定向修复</h2><p class="muted">任务在当前对话中由助理执行。登记任务不会直接生成图片。</p><label>任务类型<select id="kind"><option value="background">背景与辅助图形</option><option value="asset">独立素材</option><option value="whole">整张海报候选</option><option value="local-edit">局部修改</option></select></label><label>本轮目标<textarea id="goal"></textarea></label><label>特别注意事项<textarea id="notes"></textarea></label><button id="queue">登记生产任务</button><div id="jobs"></div></section><section><h2>交付验收</h2><div id="deliveries"></div><p class="muted">PNG/ORA 为真实栅格分层。文字内容与来源可保留，文件不等同可编辑 PSD。</p></section></aside></div><script src="/app.js"></script></html>
